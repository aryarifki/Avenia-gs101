<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradien Cahaya Sinyal Siber & Perak Esoteris -->
    <linearGradient id="boneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F6FC" />
      <stop offset="65%" stop-color="#C9D1D9" />
      <stop offset="100%" stop-color="#6E7681" />
    </linearGradient>

    <linearGradient id="cyanSignal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A8CC" />
      <stop offset="100%" stop-color="#004E66" />
    </linearGradient>

    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#070A0E" stop-opacity="0" />
    </radialGradient>

    <!-- Efek Pendaran Halus (Subtle Cyber Glow) -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Kanvas Obsidian Void -->
  <rect width="800" height="600" fill="#070A0E" />

  <!-- Grid Konstruksi Geometri Halus (Latar Belakang Radar) -->
  <g stroke="#161B22" stroke-width="1" fill="none">
    <circle cx="360" cy="260" r="220" stroke-dasharray="4 8" />
    <circle cx="360" cy="260" r="150" />
    <line x1="80" y1="260" x2="720" y2="260" stroke-dasharray="2 6" />
    <line x1="360" y1="40" x2="360" y2="540" stroke-dasharray="2 6" />
  </g>

  <!-- Pendaran Inti -->
  <circle cx="360" cy="260" r="140" fill="url(#voidGlow)" />

  <!-- 1. ALIS / STEALTH VISOR (Transformasi Alis Horus menjadi Bilah Tajam) -->
  <path d="M 115 212 
           C 210 118, 345 104, 485 152 
           C 565 178, 635 170, 695 132 
           C 655 186, 575 206, 478 178 
           C 350 140, 225 154, 138 222 Z" fill="url(#boneGradient)" />

  <!-- 2. KELOPAK ATAS & EKOR HORIZONTAL TAJAM (Apertur Atas) -->
  <path d="M 130 264 
           C 215 172, 375 158, 515 236 
           C 575 268, 635 264, 688 232 
           C 650 282, 578 294, 502 258 
           C 375 196, 228 206, 155 268 Z" fill="url(#boneGradient)" />

  <!-- 3. KELOPAK BAWAH & SPIRAL LOGARITMIK (Jejak Sinyal / Signal Trace) -->
  <path d="M 148 278 
           C 235 348, 378 354, 495 278 
           C 468 308, 418 332, 355 336 
           C 395 395, 485 458, 565 442 
           C 620 430, 648 382, 628 342 
           C 612 312, 574 308, 558 332 
           C 546 350, 558 372, 578 372 
           C 564 382, 540 370, 540 344 
           C 540 308, 585 288, 626 308 
           C 672 332, 668 408, 612 448 
           C 535 502, 412 454, 326 336 
           C 258 332, 192 312, 148 278 Z" fill="url(#boneGradient)" />

  <!-- 4. AKSIS VERTIKAL KIRI BAWAH (Transformasi Tetesan Air Mata menjadi Jarum Data) -->
  <path d="M 272 334 
           L 298 340 
           L 312 486 
           L 286 432 
           L 264 422 
           L 278 392 Z" fill="url(#boneGradient)" />
  <!-- Garis Presisi Vertikal (Crosshair Drop) -->
  <line x1="312" y1="345" x2="312" y2="515" stroke="#00F0FF" stroke-width="2" stroke-dasharray="18 6 4 6" filter="url(#subtleGlow)" />

  <!-- 5. THE HYPNOTIC VOID (Pusaran Labirin Optik & Topologi Data) -->
  <g transform="translate(360, 260)">
    <!-- Cincin Labirin 1 (Perimeter Luar - Segmen Data) -->
    <circle r="70" fill="none" stroke="#F0F6FC" stroke-width="6" stroke-dasharray="85 18 42 18 110 22" transform="rotate(-25)" />
    
    <!-- Cincin Labirin 2 (Jalur Sonar Siber) -->
    <circle r="56" fill="none" stroke="url(#cyanSignal)" stroke-width="5" stroke-dasharray="60 15 25 15 90 20" transform="rotate(40)" filter="url(#subtleGlow)" />

    <!-- Jembatan Labirin Radier (Node Connectors) -->
    <line x1="0" y1="-70" x2="0" y2="-56" stroke="#F0F6FC" stroke-width="5" transform="rotate(15)" />
    <line x1="0" y1="-70" x2="0" y2="-56" stroke="#F0F6FC" stroke-width="5" transform="rotate(195)" />
    <line x1="0" y1="-56" x2="0" y2="-42" stroke="#00F0FF" stroke-width="4" transform="rotate(105)" />
    <line x1="0" y1="-56" x2="0" y2="-42" stroke="#00F0FF" stroke-width="4" transform="rotate(285)" />

    <!-- Cincin Labirin 3 (Enkripsi Lapisan Dalam) -->
    <circle r="42" fill="none" stroke="#F0F6FC" stroke-width="5" stroke-dasharray="45 14 20 14 55 16" transform="rotate(-70)" />

    <!-- Cincin Labirin 4 (Anomali Sinyal) -->
    <circle r="28" fill="none" stroke="#00F0FF" stroke-width="4" stroke-dasharray="30 10 12 10 40 12" transform="rotate(110)" filter="url(#subtleGlow)" />
    <line x1="0" y1="-42" x2="0" y2="-28" stroke="#F0F6FC" stroke-width="4" transform="rotate(-35)" />
    <line x1="0" y1="-28" x2="0" y2="-15" stroke="#00F0FF" stroke-width="3" transform="rotate(145)" />

    <!-- Cincin Labirin 5 (Event Horizon) -->
    <circle r="15" fill="none" stroke="#F0F6FC" stroke-width="3" stroke-dasharray="16 7 8 7" transform="rotate(20)" />

    <!-- INTI VOID (Ruang Kosong Hipnotis + Retikel Berlian Mikro) -->
    <circle r="9" fill="#070A0E" />
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#00F0FF" filter="url(#subtleGlow)" />
  </g>

  <!-- Node Terminasi Sinyal pada Ujung Ekor Spiral -->
  <circle cx="578" cy="372" r="5" fill="#00F0FF" filter="url(#subtleGlow)" />
</svg>