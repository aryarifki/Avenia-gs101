name: build-avenia-gs101-droidspaces

# Trigger:
#  - Manual: tab Actions → Run workflow (bisa PIN ref upstream untuk build reproducible)
#  - Otomatis: push patches/** atau configs/**, cron Senin 03:00 UTC
#  - Sinkronisasi DroidSpaces: workflow sync-droidspaces men-dispatch build ini
on:
  workflow_dispatch:
    inputs:
      is_release:
        description: "IS_RELEASE=1 → LTO/CFI/SCS + zip release"
        required: false
        default: "1"
      kernel_ref:
        description: "Pin Reinazhard/guacamole_sickness (branch/tag/SHA penuh; kosong=staging)"
        required: false
        default: ""
      ksu_ref:
        description: "Pin Reinazhard/KernelSU (kosong=fork)"
        required: false
        default: ""
      scripts_ref:
        description: "Pin Reinazhard/scripts (kosong=main)"
        required: false
        default: ""
      ak3_ref:
        description: "Pin Reinazhard/AnyKernel3 (kosong=raviole)"
        required: false
        default: ""
      force_release:
        description: "1 = tetap terbitkan rilis walau zip identik dengan rilis terakhir"
        required: false
        default: "0"
  schedule:
    # Rebuild mingguan — selalu HEAD upstream saat clone (kecuali di-pin manual).
    - cron: "0 3 * * 1"   # Senin 03:00 UTC (±10:00 WIB)
  push:
    branches: [main]
    paths:
      - "patches/**"        # perubahan patch → wajib build
      - "configs/**"        # requirement DroidSpaces berubah → wajib build
      # edit workflow/docs sengaja TIDAK men-trigger build

permissions:
  contents: read

# Satu build per ref; dispatch baru membatalkan build lama (hemat menit runner).
concurrency:
  group: avenia-gs101-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: Reinazhard/guacamole_sickness
  KSU_REPO: Reinazhard/KernelSU
  SCRIPTS_REPO: Reinazhard/scripts
  AK3_REPO: Reinazhard/AnyKernel3

jobs:
  build:
    name: avenia-gs101 (KernelSU fork + DroidSpaces)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read        # build tidak perlu hak tulis

    steps:
      - name: Checkout repo CI (token tidak disimpan di .git/config)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bebaskan disk runner
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /etc/mysql /etc/php \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Dependencies host
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio dwarves flex kmod \
            libssl-dev libncurses-dev rsync wget zip

      - name: Clone upstream (dengan opsi pin)
        env:
          KREF: ${{ inputs.kernel_ref }}
          KREF_KSU: ${{ inputs.ksu_ref }}
          SREF: ${{ inputs.scripts_ref }}
          AREF: ${{ inputs.ak3_ref }}
        run: |
          set -euo pipefail
          clone_pin() {
            url="$1"; ref="$2"; dir="$3"
            echo ">>> $url @ ${ref:-<default>} → $dir"
            if [ -n "$ref" ] && git clone --depth 1 --branch "$ref" "$url" "$dir" 2>/dev/null; then
              :
            else
              rm -rf "$dir"
              git clone --depth 1 "$url" "$dir"
              if [ -n "$ref" ]; then
                echo "    ref bukan branch — fetch SHA/tag: $ref"
                git -C "$dir" fetch --depth 1 origin "$ref" || {
                  echo "::error::gagal fetch '$ref' — pakai branch, tag, atau SHA penuh (40 karakter)"; exit 1; }
                git -C "$dir" checkout -q FETCH_HEAD
              fi
            fi
            git -C "$dir" log -1 --format='    HEAD %H %cs %s'
          }
          clone_pin "https://github.com/$KERNEL_REPO"  "${KREF:-staging}" kernel
          clone_pin "https://github.com/$SCRIPTS_REPO" "${SREF:-main}"    scripts
          clone_pin "https://github.com/$KSU_REPO"     "${KREF_KSU:-fork}" kernel/KernelSU
          clone_pin "https://github.com/$AK3_REPO"     "${AREF:-raviole}"  kernel/AnyKernel3

      - name: Terapkan patch Avenia (9001 → 9005)
        run: |
          set -euo pipefail
          cd kernel
          for p in ../patches/*.patch; do
            echo ">>> applying $p"
            patch -p1 --forward < "$p"
          done

      - name: "Terapkan requirement DroidSpaces (sumber: configs/droidspaces.requirements)"
        run: |
          set -euo pipefail
          DEFCONFIG=kernel/arch/arm64/configs/raviole_defconfig
          REQ=configs/droidspaces.requirements
          RESOLVED="$GITHUB_WORKSPACE/requirements.resolved"
          [ -f "$REQ" ] || { echo "::error::$REQ tidak ada"; exit 1; }

          # Indeks simbol Kconfig yang BENAR-BENAR ada di tree ini. Simbol dari
          # dokumen upstream yang tidak ada (mis. nama lama sebelum 4.18)
          # dilewati + warning. Tanpa ini Kconfig membuangnya diam-diam dan
          # quality gate gagal tanpa sebab yang jelas (kasus build #12:
          # CONFIG_NETFILTER_XT_TARGET_REJECT → sudah jadi IP_NF/ IP6_NF_*).
          IDX=$(mktemp)
          find kernel -type f -name 'Kconfig*' -print0 \
            | xargs -0 grep -hE '^(menu)?config [A-Z0-9_]+' 2>/dev/null \
            | awk '{print $2}' | sort -u > "$IDX" || true
          echo "indeks Kconfig tree: $(wc -l < "$IDX") simbol"

          : > "$RESOLVED"
          added=0; skipped=0
          while IFS= read -r line; do
            sym="${line%%=*}"
            case "$sym" in
              CONFIG_CFS_BANDWIDTH|CONFIG_CGROUP_PIDS)
                echo "::error::$sym dilarang — merusak kABI modul vendor prebuilt"; exit 1 ;;
              CONFIG_*) ;;
              *) continue ;;
            esac
            printf '%s' "$line" | grep -qE '^CONFIG_[A-Z0-9_]+=y$' || continue
            if ! grep -qx "${sym#CONFIG_}" "$IDX"; then
              echo "::warning::$sym tidak ada di Kconfig tree ini — dilewati"
              skipped=$((skipped+1)); continue
            fi
            printf '%s\n' "$line" >> "$RESOLVED"
            if grep -qE "^${sym}=y$" "$DEFCONFIG"; then continue; fi
            if grep -qE "^# ${sym} is not set$" "$DEFCONFIG"; then
              sed -i "s/^# ${sym} is not set$/${sym}=y/" "$DEFCONFIG"
            else
              printf '\n%s\n' "$line" >> "$DEFCONFIG"
            fi
            added=$((added+1))
          done < "$REQ"
          echo "DroidSpaces: $added simbol baru ditambahkan, $skipped dilewati"
          echo "requirement efektif (di-gate): $(grep -cE '^CONFIG_' "$RESOLVED") simbol"
          {
            echo "### Requirement DroidSpaces"
            echo "- ditambahkan ke defconfig: $added"
            echo "- dilewati (tidak ada di Kconfig): $skipped"
            echo "- di-gate: $(grep -cE '^CONFIG_' "$RESOLVED") simbol"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Branding + guard AnyKernel3
        run: |
          set -euo pipefail
          AK=kernel/AnyKernel3/anykernel.sh
          sed -i 's|^kernel.string=.*|kernel.string=Avenia Kernel by aryarifki|' "$AK"
          test "$(grep -c '^kernel.string=Avenia Kernel by aryarifki$' "$AK")" = 1 \
            || { echo "::error::kernel.string gagal di-set"; exit 1; }
          for d in oriole raven bluejay; do
            grep -qE "^device\.name[0-9]+=${d}$" "$AK" \
              || { echo "::error::device-check '$d' hilang dari AK3 upstream"; exit 1; }
          done
          grep -qE '^do\.devicecheck=1$' "$AK" \
            || { echo "::error::do.devicecheck bukan 1"; exit 1; }
          grep -qE '^do\.modules=0$' "$AK" \
            || { echo "::error::do.modules bukan 0 — modul vendor Pixel bisa tertimpa"; exit 1; }
          grep -q 'flash_generic dtbo' "$AK" \
            || { echo "::error::flash_generic dtbo hilang — dtbo Pixel tidak ter-flash"; exit 1; }
          echo "AK3 guard ✓ (devicecheck oriole/raven/bluejay, do.modules=0, dtbo)"

      - name: Build (ZIPNAME=Avenia, KSU=1, IS_RELEASE, CLANG_SOURCE=aosp)
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          set -o pipefail
          CLANG_SOURCE=aosp IS_RELEASE=${{ inputs.is_release || '1' }} KSU=1 ZIPNAME=Avenia \
            bash ../scripts/raviole/build.sh 2>&1 | tee ../build.log

      - name: Quality gate — semua requirement DroidSpaces =y + larangan kABI
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          REQ="$GITHUB_WORKSPACE/requirements.resolved"
          [ -s "$REQ" ] || { echo "::error::requirements.resolved kosong — merge step gagal?"; exit 1; }
          failed=0
          while IFS= read -r line; do
            sym="${line%%=*}"
            grep -qE "^${sym}=y$" out/.config \
              || { echo "MISSING: ${sym} — diminta adendum DroidSpaces tapi tidak muncul di out/.config"; failed=1; }
          done < "$REQ"
          if grep -qE '^CONFIG_(CFS_BANDWIDTH|CGROUP_PIDS)=y' out/.config; then
            echo "ABI-VENDOR: CFS_BANDWIDTH/CGROUP_PIDS harus tetap off"; failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "=== gate DroidSpaces ✓ ($(grep -cE '^CONFIG_' "$REQ") simbol) ==="

      - name: Paket artifact + metadata build
        run: |
          set -euo pipefail
          mkdir -p out
          ZIP=$(ls kernel/AnyKernel3/*.zip | head -1)
          cp "$ZIP" out/
          ( cd out && sha256sum "$(basename "$ZIP")" > checksums.txt && cat checksums.txt )
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess

          def git_log(path):
              out = subprocess.check_output(
                  ["git", "-C", path, "log", "-1", "--format=%H%n%cs%n%s"], text=True
              ).strip().split("\n")
              return {"sha": out[0], "date": out[1], "subject": out[2]}

          meta = {
              "run": int(os.environ["GITHUB_RUN_NUMBER"]),
              "repo_sha": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "components": {
                  "kernel": git_log("kernel"),
                  "ksu": git_log("kernel/KernelSU"),
                  "scripts": git_log("scripts"),
                  "ak3": git_log("kernel/AnyKernel3"),
              },
          }

          try:
              susfs = pathlib.Path("kernel/include/linux/susfs.h").read_text(errors="ignore")
              m = re.search(r'#define\s+SUSFS_VERSION\s+"([^"]+)"', susfs)
              meta["susfs"] = m.group(1) if m else "unknown"
          except FileNotFoundError:
              meta["susfs"] = "unknown"

          try:
              kbuild = pathlib.Path("kernel/KernelSU/kernel/Kbuild").read_text(errors="ignore")
              m = re.search(r'^KSU_VERSION\s*:=\s*(\d+)', kbuild, re.M)
              meta["ksu_version"] = m.group(1) if m else "unknown"
          except FileNotFoundError:
              meta["ksu_version"] = "unknown"

          try:
              log = pathlib.Path("build.log").read_text(errors="ignore")
              m = re.findall(r'clang version (\d+\.\d+\.\d+)', log)
              meta["clang"] = m[-1] if m else "unknown"
          except FileNotFoundError:
              meta["clang"] = "unknown"

          defconfig = pathlib.Path("kernel/arch/arm64/configs/raviole_defconfig").read_text(errors="ignore")
          m = re.search(r'^CONFIG_LOCALVERSION="([^"]*)"', defconfig, re.M)
          meta["localversion"] = m.group(1) if m else ""
          meta["patches"] = [
              {"file": p.name, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in sorted(pathlib.Path("patches").glob("*.patch"))
          ]
          meta["droidspaces"] = {
              line.split("=", 1)[0]: line.split("=", 1)[1]
              for line in pathlib.Path("configs/droidspaces.source").read_text().splitlines()
              if "=" in line and not line.startswith("#")
          }
          pathlib.Path("out/meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          print(json.dumps(meta, indent=2))
          PY

      - name: Smoke test zip — isi, identitas kernel, dan checksum
        run: |
          set -euo pipefail
          python3 .github/scripts/smoke_test.py --dist out
          {
            echo "### Smoke test artifact"
            echo "Lulus: isi zip, branding AK3, banner \`Linux version …-Avenia\`, FDT dtb,"
            echo "magic dtbo.img, dan sha256 vs \`checksums.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact (zip + checksum + metadata)
        uses: actions/upload-artifact@v4
        with:
          name: avenia-gs101-ksu-release-droidspaces
          path: out/
          retention-days: 14
          if-no-files-found: error

      - name: Upload log GAGAL (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            build.log
            kernel/out/.config
            requirements.resolved
          retention-days: 3
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job terpisah: satu-satunya yang memegang token dengan hak tulis.
  # ---------------------------------------------------------------------------
  release:
    name: Rilis + changelog
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: avenia-gs101-release
      cancel-in-progress: false

    steps:
      - name: Checkout (riwayat penuh untuk changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact build
        uses: actions/download-artifact@v4
        with:
          name: avenia-gs101-ksu-release-droidspaces
          path: dist

      - name: Susun changelog + cek duplikat
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force_release || '0' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py \
            --dist dist \
            --meta dist/meta.json \
            --out release-notes.md \
            --changelog changelog-section.md \
            --repo "$GITHUB_REPOSITORY" \
            --run "$GITHUB_RUN_NUMBER" \
            --sha "$GITHUB_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --force "${FORCE_RELEASE}"
          echo "### Hasil" >> "$GITHUB_STEP_SUMMARY"
          echo "- zip: \`$(ls dist/*.zip | xargs -n1 basename)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: \`$(grep -oE '^[0-9a-f]{64}' dist/checksums.txt)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- duplikat: \`${{ steps.notes.outputs.duplicate }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Rilis otomatis → halaman Releases
        if: steps.notes.outputs.duplicate != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: avenia-gs101-r${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Avenia gs101 r${{ github.run_number }}
          body_path: release-notes.md
          files: |
            dist/*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
          make_latest: true

      - name: Update CHANGELOG.md + state upstream
        if: steps.notes.outputs.duplicate != 'true'
        run: |
          set -euo pipefail
          git pull --rebase origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
          {
            echo "# Changelog — Avenia Kernel (gs101)"
            echo
            echo "Digenerate otomatis oleh CI. Setiap entri = satu rilis GitHub."
            echo
            cat changelog-section.md
            if [ -f CHANGELOG.md ]; then
              sed -n '/^## /,$p' CHANGELOG.md
            fi
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          cp dist/meta.json .upstream-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .upstream-state.json
          if git diff --cached --quiet; then
            echo "tidak ada perubahan CHANGELOG/state"
            exit 0
          fi
          git commit -m "changelog: r$GITHUB_RUN_NUMBER [skip ci]"
          git push

      - name: Ringkasan bila rilis dilewati
        if: steps.notes.outputs.duplicate == 'true'
        run: |
          {
            echo "## Rilis dilewati (duplikat)"
            echo
            echo "Zip yang dibangun **byte-identik** dengan rilis terakhir — tidak ada perubahan"
            echo "biner (upstream & patch tidak berubah). Artifact tetap tersimpan 14 hari."
            echo
            echo "Butuh rilis tetap dibuat? Jalankan manual dengan \`force_release=1\`."
          } >> "$GITHUB_STEP_SUMMARY"
